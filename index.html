<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GvG Team Planner</title>
  <script>
    // Áp theme trước khi vẽ trang để không bị nháy màu
    try {
      var t = localStorage.getItem('gvg-team-planner/theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12A9 9 0 0 1 18.5 5.8"/><path d="M21 4v5h-5M3 20v-5h5"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
      <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/></symbol>
      <symbol id="i-hex" viewBox="0 0 24 24"><path d="M12 2.5 20.5 7.3v9.4L12 21.5l-8.5-4.8V7.3z"/><circle cx="12" cy="12" r="2.5"/></symbol>
      <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4v16M4 17l3 3 3-3M17 20V4M14 7l3-3 3 3"/></symbol>
      <symbol id="i-grip"viewBox="0 0 24 24"><path d="M9 5h.01M15 5h.01M9 12h.01M15 12h.01M9 19h.01M15 19h.01" stroke-width="3.2"/></symbol>
      <symbol id="i-play"viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <header class="mobile-bar">
      <button class="icon-btn plain" id="btnMenu" aria-label="Mở menu"><svg class="i"><use href="#i-menu"/></svg></button>
      <span class="brand-name">GvG Team Planner</span>
    </header>

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">G</span>
        <span class="brand-name">GvG Team Planner</span>
      </div>
      <nav id="tabs" class="nav" aria-label="Điều hướng"></nav>

      <div class="side-foot">
        <button id="btnToken" class="btn btn-block" title="Token chung (GitHub) để lưu Rosters lên bản chung cho mọi người"><svg class="i"><use href="#i-upload"/></svg><span>Nhập token để sửa chung</span></button>
        <div id="cloudStatus" class="muted" style="font-size:12px">Đang tải bản chung…</div>
        <button id="btnIcons" class="btn btn-block"><svg class="i"><use href="#i-refresh"/></svg><span>Cập nhật icon</span></button>
        <div class="btn-row">
          <button id="btnImport" class="btn" title="Nạp file JSON: toàn bộ, chỉ Rosters, team OFF-TYPE, hoặc roster từng member (chọn được nhiều file)"><svg class="i"><use href="#i-upload"/></svg><span>Import</span></button>
          <div class="dropdown">
            <button id="btnExport" class="btn btn-primary"><svg class="i"><use href="#i-download"/></svg><span>Export</span></button>
            <div class="dropdown-menu" id="exportMenu">
              <button data-export="all">Toàn bộ (Rosters + Teams + OFF-TYPE)</button>
              <button data-export="rosters">Chỉ Rosters</button>
              <button data-export="offtype">Chỉ team OFF-TYPE</button>
              <button data-export="members">Từng member (mỗi người 1 file)…</button>
            </div>
          </div>
        </div>
        <div class="theme-switch" id="themeSwitch" role="radiogroup" aria-label="Giao diện">
          <button data-theme-mode="light" role="radio" title="Sáng"><svg class="i"><use href="#i-sun"/></svg></button>
          <button data-theme-mode="dark" role="radio" title="Tối"><svg class="i"><use href="#i-moon"/></svg></button>
          <button data-theme-mode="system" role="radio" title="Theo hệ thống"><svg class="i"><use href="#i-monitor"/></svg></button>
        </div>
        <span id="saveStatus" class="save-status"></span>
        <input type="file" id="fileInput" accept=".json,application/json" multiple hidden>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main id="view"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="iconDialog" class="icon-dialog"></dialog>
  <dialog id="appDialog" class="icon-dialog app-dialog"></dialog>
  <dialog id="offDialog" class="icon-dialog off-dialog" aria-label="Tạo team OFF-TYPE"></dialog>

  <script src="seed.js"></script>
  <script src="offteams.js"></script>
  <script src="icons/catalog.js"></script>
  <script src="icon-match.js"></script>
  <script src="seasons.js"></script>
  <script src="app.js"></script>
</body>
</html>
